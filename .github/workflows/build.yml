name: Build and Release

# One matrix job per shipping platform; every job attaches its installer to
# the SAME draft release v<version> (tauri-action creates it if missing, then
# uploads — the standard tauri matrix pattern). Publishing the draft fires
# publish-site.yml, which pushes all assets to the website's R2 + download menu.
#
# Assets produced (names drive the website's platform mapping — keep stable):
#   macos-arm64  → Termany_X.Y.Z_aarch64.dmg          (signed + notarized)
#   macos-x64    → Termany_X.Y.Z_x64.dmg              (signed + notarized)
#   windows-x64  → Termany_X.Y.Z_x64-setup.exe        (NSIS, unsigned)
#   linux-x64    → Termany_X.Y.Z_amd64.AppImage/.deb  (unsigned)
#
# Tag pushes build both macOS architectures plus Windows x64 and attach the
# results to one release. Linux remains available as a manual test build until
# its next public release.
# To ship: bump the version, then
# `git tag v<version> && git push origin v<version>`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (manual test artifact only)
        required: true
        default: windows-x64
        type: choice
        options:
          - windows-x64
          - linux-x64
          - macos-arm64
          - macos-x64
          - macos
          - all

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  select-matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select build matrix
        id: select
        shell: bash
        env:
          # Tag pushes have no workflow_dispatch inputs, so they select the
          # shipping matrix. Manual runs continue to build only the requested
          # platform (or all platforms when explicitly selected).
          REQUESTED_PLATFORM: ${{ inputs.platform || 'release' }}
        run: |
          case "$REQUESTED_PLATFORM" in
            windows-x64)
              matrix='{"include":[{"platform":"windows-x64","runner":"windows-latest"}]}'
              ;;
            linux-x64)
              matrix='{"include":[{"platform":"linux-x64","runner":"ubuntu-22.04"}]}'
              ;;
            macos-arm64)
              matrix='{"include":[{"platform":"macos-arm64","runner":"macos-latest"}]}'
              ;;
            macos-x64)
              matrix='{"include":[{"platform":"macos-x64","runner":"macos-15-intel"}]}'
              ;;
            macos)
              matrix='{"include":[{"platform":"macos-arm64","runner":"macos-latest"},{"platform":"macos-x64","runner":"macos-15-intel"}]}'
              ;;
            release)
              matrix='{"include":[{"platform":"macos-arm64","runner":"macos-latest"},{"platform":"macos-x64","runner":"macos-15-intel"},{"platform":"windows-x64","runner":"windows-latest"}]}'
              ;;
            all)
              matrix='{"include":[{"platform":"macos-arm64","runner":"macos-latest"},{"platform":"macos-x64","runner":"macos-15-intel"},{"platform":"windows-x64","runner":"windows-latest"},{"platform":"linux-x64","runner":"ubuntu-22.04"}]}'
              ;;
            *)
              echo "Unsupported platform: $REQUESTED_PLATFORM" >&2
              exit 1
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: select-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
          key: ${{ matrix.platform }}

      - name: Install Tauri system deps (Linux)
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install dependencies
        run: npm install

      - name: Build web frontend
        run: npm run build:web

      # bundle-server.mjs is host-platform aware: it downloads the matching
      # Node runtime and keeps only this platform's node-pty prebuild, so each
      # matrix job produces its own native server bundle.
      - name: Bundle the Node server (node + node-pty + server.cjs)
        run: npm run bundle:server

      - name: Sign bundled server binaries (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          RES="apps/desktop/src-tauri/resources/server"
          ENTITLEMENTS="$GITHUB_WORKSPACE/apps/desktop/src-tauri/entitlements.plist"

          # Import the signing certificate into a temporary keychain.
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/server-signing.keychain-db"
          KEYCHAIN_PW=$(openssl rand -base64 24)
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          # The Node runtime needs JIT entitlements; the native addons just need
          # a hardened-runtime signature.
          codesign --force --options runtime --entitlements "$ENTITLEMENTS" \
            --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$RES/node"
          find "$RES" \( -name "*.node" -o -name "spawn-helper" \) -type f | while read -r f; do
            codesign --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$f"
          done

          security delete-keychain "$KEYCHAIN"
          rm -f "$CERT_PATH"

      - name: Build, bundle & attach to the draft release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple signing/notarization vars are only read on macOS runners.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Self-update artifacts (createUpdaterArtifacts) are signed with the
          # Tauri updater key on every platform — without it `tauri build` fails.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri --
          # No args: build the host default target; Tauri auto-merges
          # src-tauri/tauri.<platform>.conf.json (signing/resources/targets).
          # (--config / --target via tauri-action's args land after a `--`,
          # where cargo — not tauri — would try to parse them.)
          tagName: v__VERSION__
          releaseName: "Termany v__VERSION__"
          releaseBody: "macOS: download the .dmg for your chip (aarch64 = Apple Silicon, x64 = Intel). Windows: download the x64 NSIS setup .exe. Linux remains on v0.2.0 for now."
          releaseDraft: true
          prerelease: false
          # The Windows bundle target is NSIS. Prefer it explicitly when the
          # action builds updater metadata (Tauri also emits its .exe.sig).
          updaterJsonPreferNsis: true

      - name: Build manual test artifact
        if: github.event_name == 'workflow_dispatch'
        working-directory: apps/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri -- build

      - name: Upload manual test artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Termany-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
