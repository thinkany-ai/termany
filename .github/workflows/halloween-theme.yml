name: Halloween theme checks

# Evidence for the Halloween theme that does not depend on anyone's taste:
# - sprite audit: every committed sheet matches its hand-placed source, and
#   every pixel is opaque or transparent and in the locked palette;
# - flash analysis: WCAG 2.3.1 thresholds over every sequence the player can
#   show, plus a self-test that the analyzer fails a real strobe;
# - player rules (SPR-1..7) as unit tests;
# - browser tests at device pixel ratio 1 and 2: the share-pose snapshot,
#   whole-block integer scaling, a short window, a long page list, reduced
#   motion, and the agent alert.

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "scripts/halloween-*.mjs"
      - "package-lock.json"
      - ".github/workflows/halloween-theme.yml"
  push:
    branches: [dev, main]
    paths:
      - "apps/web/**"
      - "scripts/halloween-*.mjs"
      - ".github/workflows/halloween-theme.yml"

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The demo build needs no native modules (node-pty is the server's).
      - name: Install
        run: npm ci --ignore-scripts

      - name: Sprite audit (palette, opacity, sheets match sources)
        run: node scripts/halloween-sprites.mjs --check

      - name: Flash analysis (WCAG 2.3.1)
        run: node --import tsx scripts/halloween-flash.mjs

      - name: Player rules
        working-directory: apps/web
        run: node --import tsx --test src/themes/halloween/*.test.ts

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Browser tests (dpr 1 and 2)
        working-directory: apps/web
        run: npx playwright test

      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
